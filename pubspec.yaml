name: smartshop_ai
description: AI-Powered Smart Retail Management System

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_lints: ^6.0.0
  cupertino_icons: ^1.0.8

  # ==========================
  # State Management
  # ==========================
  provider: ^6.1.5

  # ==========================
  # HTTP
  # ==========================
  http: ^1.5.0

  # ==========================
  # Local Storage
  # ==========================
  shared_preferences: ^2.5.3

  # ==========================
  # Database
  # ==========================
  sqflite: ^2.4.2

  path: ^1.9.1

  # ==========================
  # Charts
  # ==========================
  fl_chart: ^1.0.0

  # ==========================
  # Date & Time
  # ==========================
  intl: ^0.20.2

  # ==========================
  # SVG Support
  # ==========================
  flutter_svg: ^2.2.0

  # ==========================
  # Image Picker
  # ==========================
  image_picker: ^1.2.0

  # ==========================
  # File Picker
  # ==========================
  file_picker: ^10.3.2

  # ==========================
  # Permissions
  # ==========================
  permission_handler: ^12.0.1

  # ==========================
  # Export
  # ==========================
  excel: ^4.0.6

  pdf: ^3.11.3

  printing: ^5.14.2

  csv: ^6.0.0

  # ==========================
  # Path Provider
  # ==========================
  path_provider: ^2.1.5

  # ==========================
  # Share Files
  # ==========================
  share_plus: ^11.1.0

  # ==========================
  # Connectivity
  # ==========================
  connectivity_plus: ^6.1.5

  # ==========================
  # UUID
  # ==========================
  uuid: ^4.5.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^16.0.0

  
  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  

  # Networking
  dio: ^5.9.0

  # Logging
  logger: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

hive_generator: ^2.0.1
build_runner: ^2.7.0
flutter_lints: ^6.0.0


flutter:
  
  
  uses-material-design: true


  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700